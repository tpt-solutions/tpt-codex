<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tpt-codex demo</title>
    <!-- No icon: an empty one stops the browser asking the server for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <style>
      body { font-family: "Noto Sans", system-ui, sans-serif; margin: 16px; line-height: 1.5; }
      /* Marks inside a paragraph are containers; they flow inline with the text. */
      .para > div { display: inline; }
      .para > div.strong { font-weight: bold; }
      .para > div.em { font-style: italic; }
      .para > div.strong.em { font-weight: bold; font-style: italic; }
      .para > div.link { color: #1a56db; text-decoration: underline; }
      .para > div.remote-cursor { background: #fde68a; }
      table.grid-table { border-collapse: collapse; margin: 8px 0; }
      table.grid-table td, table.grid-table th { border: 1px solid #bbb; padding: 2px 8px; text-align: right; }
      input.grid-cell { width: 6em; }
      textarea.paragraph-input { width: 100%; min-height: 3em; font: inherit; }
      /* A list item's marker comes from its data-marker attribute, not from a text node. */
      .list-item::before { content: attr(data-marker) " "; }
    </style>
  </head>
  <body>
    <!-- The editor marks the presenter stage; this button makes the browser show it full screen. -->
    <button id="fullscreen" type="button">Full screen</button>
    <button id="export-pdf" type="button">Export PDF</button>
    <!-- Open any .cdx, .md, .docx, .xlsx, .pptx or .json file, or drop one on the page. -->
    <label class="file-button">Open file
      <input id="open-file" type="file" hidden
             accept=".cdx,.md,.markdown,.docx,.xlsx,.pptx,.json" />
    </label>
    <label>Save as
      <select id="save-format">
        <option value="cdx">.cdx</option>
        <option value="docx">.docx</option>
        <option value="xlsx">.xlsx</option>
        <option value="pdf">.pdf</option>
        <option value="json">.json</option>
      </select>
    </label>
    <button id="save" type="button">Save</button>
    <button id="start-over" type="button" hidden>Start over</button>
    <p id="status" role="status" style="margin: 8px 0; white-space: pre-wrap"></p>
    <main id="app"></main>
    <script type="module">
      // The pkg folder is produced by wasm-bindgen from tpt_codex_web.wasm.
      import init, { mount_sample_as } from "./pkg/tpt_codex_web.js";
      await init();
      // ?relay=ws://host:port&doc=name&replica=N joins a relay so other pages' carets are drawn.
      const params = new URLSearchParams(location.search);
      const editor = mount_sample_as("app", Number(params.get("replica") ?? "1"));
      connectRelay(editor, params);
      // The button tells the editor (so the stage is drawn as full screen) and asks the browser.
      document.getElementById("fullscreen").addEventListener("click", () => {
        editor.set_fullscreen(true);
        const stage = document.querySelector(".presenter");
        if (stage && stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
      });
      // Exports the document as a PDF and downloads it.
      document.getElementById("export-pdf").addEventListener("click", () => {
        try {
          const bytes = editor.export_pdf();
          const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
          const link = document.createElement("a");
          link.href = url;
          link.download = "document.pdf";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
          alert("PDF export failed: " + error);
        }
      });
      // ---- Opening and saving files ----
      const status = document.getElementById("status");
      let fileName = "document.cdx";
      const MEDIA = {
        cdx: "text/plain", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        pdf: "application/pdf", json: "application/json",
      };

      async function openFile(file) {
        try {
          const report = editor.open_file(file.name, new Uint8Array(await file.arrayBuffer()));
          fileName = file.name;
          status.textContent = report
            ? `Opened ${file.name}. Some things were not kept:\n${report}`
            : `Opened ${file.name}.`;
        } catch (error) {
          // The document on the page is unchanged.
          status.textContent = `Could not open ${file.name}: ${error}`;
        }
      }
      document.getElementById("open-file").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) openFile(file);
        event.target.value = "";
      });
      // Dropping a file anywhere on the page opens it.
      document.addEventListener("dragover", (event) => event.preventDefault());
      document.addEventListener("drop", (event) => {
        event.preventDefault();
        const file = event.dataTransfer?.files?.[0];
        if (file) openFile(file);
      });
      // Saves in the chosen format, named after the file that was opened.
      document.getElementById("save").addEventListener("click", () => {
        const ext = document.getElementById("save-format").value;
        const name = fileName.replace(/\.[^.]*$/, "") + "." + ext;
        try {
          const bytes = editor.save_file(name);
          const url = URL.createObjectURL(new Blob([bytes], { type: MEDIA[ext] }));
          const link = document.createElement("a");
          link.href = url;
          link.download = name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent = `Saved ${name}.`;
        } catch (error) {
          status.textContent = `Could not save ${name}: ${error}`;
        }
      });

      // ---- Autosave ----
      // The document is kept in this browser's local storage every two seconds while it differs
      // from the last copy, and comes back the next time the page opens. Pages that join a relay
      // do not restore, so that collaborators start from the same document. Storage can be
      // unavailable (private windows, blocked site data), and then nothing is saved.
      const KEY = "tpt-codex-autosave";
      const store = {
        get() { try { return localStorage.getItem(KEY); } catch { return null; } },
        set(value) { try { localStorage.setItem(KEY, value); } catch { /* not saved */ } },
        clear() { try { localStorage.removeItem(KEY); } catch { /* nothing to clear */ } },
      };
      const snapshot = () => new TextDecoder().decode(editor.save_file("autosave.json"));
      const startOver = document.getElementById("start-over");
      let lastSaved = snapshot();
      const saved = params.has("relay") || params.has("fresh") ? null : store.get();
      if (saved) {
        try {
          editor.open_file("autosave.json", new TextEncoder().encode(saved));
          lastSaved = snapshot();
          status.textContent = "Restored your last session.";
          startOver.hidden = false;
        } catch { store.clear(); }
      }
      startOver.addEventListener("click", () => { store.clear(); location.reload(); });
      setInterval(() => {
        try {
          const now = snapshot();
          if (now !== lastSaved) { store.set(now); lastSaved = now; }
        } catch { /* a document that cannot be saved is not stored */ }
      }, 2000);

      // When the browser leaves full screen (for example with Escape), the editor follows.
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) editor.set_fullscreen(false);
      });

      // Joins the relay for presence only: the page passes received frames to the editor, and
      // sends back the frames the editor produces when its caret moves. Operations are not sent.
      function connectRelay(editor, params) {
        const relay = params.get("relay");
        if (!relay) return;
        const docId = params.get("doc") ?? "demo";
        const socket = new WebSocket(relay);
        let joined = false;
        socket.addEventListener("open", () => {
          socket.send(JSON.stringify({ join: docId }));
        });
        socket.addEventListener("message", (event) => {
          const text = String(event.data);
          if (!joined) {
            // The relay answers the join with this frame; then it replays the log.
            if (text === '{"joined":true}') {
              joined = true;
              // The relay keeps no presence, so tell the peers already here where this caret is.
              editor.announce_again();
            }
            return;
          }
          try {
            editor.receive_sync(text);
          } catch (e) {
            // Not a message this page understands; ignored.
          }
        });
        setInterval(() => {
          if (!joined || socket.readyState !== WebSocket.OPEN) return;
          for (const line of editor.pending_sync().split("\n")) {
            if (line) socket.send(line);
          }
        }, 50);
      }
    </script>
  </body>
</html>
