[package]
name = "tpt-typeset"
description = "Semantic typesetting for tpt-codex: outline, math, citations, footnotes, cross-references and queries (no_std + alloc)."
readme = "README.md"
keywords = ["typesetting", "latex-math", "bibliography", "outline", "no-std"]
categories = ["text-processing", "parser-implementations", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tpt-codex-core.workspace = true
tpt-codex-views.workspace = true
tpt-query = { workspace = true, features = ["json"] }
serde_json.workspace = true
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float", "opentype-layout"] }

[dev-dependencies]
tpt-codex-markdown.workspace = true

[lints]
workspace = true
