[package]
name = "tpt-codex-app"
description = "WASM-first application shell for tpt-codex (std)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tpt-codex-core.workspace = true
tpt-codex-markdown.workspace = true
tpt-codex-views.workspace = true
tpt-typeset.workspace = true
tpt-codex-grid.workspace = true
tpt-codex-text.workspace = true
tpt-codex-pdf.workspace = true
tpt-appfront-core.workspace = true
tpt-appfront-html.workspace = true
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tpt-appfront-dom.workspace = true
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[dev-dependencies]
# Tests only: the relay that the presence test talks through. Not part of the wasm build.
tpt-codex-sync = { path = "../tpt-codex-sync" }
