[package]
name = "tpt-codex-files"
description = "Opens and saves documents as .cdx, .md, .docx, .xlsx, .json and .pdf, and opens .pptx, from and to bytes (std)."
readme = "README.md"
keywords = ["file-format", "open-save", "docx", "xlsx", "markdown"]
categories = ["encoding", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tpt-codex-core.workspace = true
tpt-codex-markdown.workspace = true
tpt-codex-interop.workspace = true
tpt-codex-pdf.workspace = true
tpt-codex-grid.workspace = true
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
