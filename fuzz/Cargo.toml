[package]
name = "tpt-codex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tpt-codex-core = { path = "../crates/tpt-codex-core" }
tpt-codex-markdown = { path = "../crates/tpt-codex-markdown" }
tpt-codex-interop = { path = "../crates/tpt-codex-interop" }
tpt-typeset = { path = "../crates/tpt-typeset" }

# Not part of the main workspace, so libFuzzer and the nightly toolchain stay out of the
# licence-checked dependency tree.
[workspace]

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document_json"
path = "fuzz_targets/document_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "math"
path = "fuzz_targets/math.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bibliography"
path = "fuzz_targets/bibliography.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx"
path = "fuzz_targets/xlsx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx"
path = "fuzz_targets/docx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pptx"
path = "fuzz_targets/pptx.rs"
test = false
doc = false
bench = false
