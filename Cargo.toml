[workspace]
resolver = "2"
members = ["crates/*"]
# The fuzz harness needs libFuzzer and nightly; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-spec"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false

[workspace.dependencies]
tpt-codex-core = { path = "crates/tpt-codex-core" }
tpt-codex-views = { path = "crates/tpt-codex-views" }
tpt-codex-markdown = { path = "crates/tpt-codex-markdown" }
tpt-typeset = { path = "crates/tpt-typeset" }
tpt-codex-interop = { path = "crates/tpt-codex-interop" }
tpt-codex-app = { path = "crates/tpt-codex-app" }
tpt-codex-grid = { path = "crates/tpt-codex-grid" }
tpt-codex-text = { path = "crates/tpt-codex-text" }
tpt-codex-sync = { path = "crates/tpt-codex-sync" }
tpt-codex-pdf = { path = "crates/tpt-codex-pdf" }
tpt-codex-files = { path = "crates/tpt-codex-files" }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Office-format support, written in-house on these pure-Rust, permissively licensed crates.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
quick-xml = "0.37"

# TPT ecosystem crates, pinned by rev (crates.io publication is not available yet).
# Revs are the default-branch heads checked on 2026-11-04. Only crates that a member uses are
# listed here; the others are pinned in docs/tpt-dependency-map.md until they are wired in.
tpt-query = { git = "https://github.com/tpt-solutions/tpt-query", rev = "6b06d02c70f273a658e9aefee26473988160bb74" }
tpt-lattice-core = { git = "https://github.com/tpt-solutions/tpt-lattice", rev = "d72332117c1c5f2074513ce9cd7ce1cf7e423d1f" }
tpt-lattice-evaluator = { git = "https://github.com/tpt-solutions/tpt-lattice", rev = "d72332117c1c5f2074513ce9cd7ce1cf7e423d1f" }
tpt-appfront-core = { git = "https://github.com/tpt-solutions/tpt-appfront", rev = "be649e1b1b499450e25e8652b5682a3967ab739f" }
tpt-appfront-html = { git = "https://github.com/tpt-solutions/tpt-appfront", rev = "be649e1b1b499450e25e8652b5682a3967ab739f" }
tpt-appfront-dom = { git = "https://github.com/tpt-solutions/tpt-appfront", rev = "be649e1b1b499450e25e8652b5682a3967ab739f" }
tpt-text = { git = "https://github.com/tpt-solutions/tpt-text", rev = "83bc13c624b9aa3cee1eccedbb6c8376e4144ea6" }
tpt-layout = { git = "https://github.com/tpt-solutions/tpt-layout", rev = "21361d18fb09e4cb620baa5571c707172ca5b355" }
# PDF output. e451560 is the glyph-outline fix (tpt-canvas master HEAD on 2026-11-06).
tpt-canvas = { git = "https://github.com/tpt-solutions/tpt-canvas", rev = "e4515600a767f5df5cbf200daabe03d3980308e2" }
tpt-canvas-pdf = { git = "https://github.com/tpt-solutions/tpt-canvas", rev = "e4515600a767f5df5cbf200daabe03d3980308e2" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

